name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs: a new push makes older in-flight runs obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hh-api:
    name: hh/api — unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hh/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Integration tests hit the live hh.ru API (403 without a real token + UA);
      # unit/contract tests are hermetic and run here.
      - run: pytest -m "not integration" -q

  hh-ui:
    name: hh/ui — typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hh/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hh/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  guap-python:
    name: guap/python — import + collect check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guap/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q api_client api_tests ui_tests
      - run: pytest --collect-only -q

  guap-go:
    name: guap/go — build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guap/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go build ./...
      - run: go vet ./...

  amocrm:
    name: amocrm — import + collect check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: amocrm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q pipelines src tests
      - run: pytest --collect-only -q