name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  hh-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hh/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  hh-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hh/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hh/ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  guap-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guap/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  guap-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guap/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go build ./...
      - run: go test ./...

  amocrm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amocrm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q